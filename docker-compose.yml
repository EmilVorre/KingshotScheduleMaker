services:
  frontend:
    image: prep-appointments-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - app
    restart: unless-stopped

  backend:
    image: prep-appointments-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      - PORT=8080
    volumes:
      - prep-data:/app/data
    networks:
      - app
    restart: unless-stopped

volumes:
  prep-data:

networks:
  app:
    driver: bridge
