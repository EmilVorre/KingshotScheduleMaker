apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kingshot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/emilvorre/kingshotschedulemaker/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: kingshot-config
            - secretRef:
                name: kingshot-secrets
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kingshot
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
