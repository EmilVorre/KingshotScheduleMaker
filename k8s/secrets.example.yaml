apiVersion: v1
kind: Secret
metadata:
  name: kingshot-secrets
  namespace: kingshot
type: Opaque
stringData:
  DATABASE_URL: postgres://kingshot:change-me@10.0.0.20:5432/kingshot
  OAUTH_DISCORD_CLIENT_ID: change-me
  OAUTH_DISCORD_CLIENT_SECRET: change-me
  OAUTH_GOOGLE_CLIENT_ID: change-me
  OAUTH_GOOGLE_CLIENT_SECRET: change-me
  OAUTH_REDIRECT_URL: https://ks.example.com/api/auth/callback
  BASE_URL: https://ks.example.com
