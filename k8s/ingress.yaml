apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kingshot-ingress
  namespace: kingshot
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ks.vorre.dev
      secretName: kingshot-tls
  rules:
    - host: ks.vorre.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          # /form/* must hit the SPA (frontend); nginx proxies only /form/{code}/api/* to backend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
