apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kingshot-ingress
  namespace: kingshot
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: ks.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /form
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
