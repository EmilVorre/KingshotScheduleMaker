# Apply after cert-manager is installed cluster-wide.
# 1) Set a real email (Let's Encrypt notifications / account recovery).
# 2) kubectl apply -f k8s/cert-manager-letsencrypt-clusterissuer.yaml
#
# Staging issuer (for testing; browsers show untrusted cert):
#   https://acme-staging-v02.api.letsencrypt.org/directory
#
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: emil@vorre.dev
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
