# Build images on release (or manually) and push to GHCR.
# Deployment is handled by a separate Kubernetes workflow.

name: Build And Publish Images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to publish (in addition to :latest). Defaults to short commit SHA."
        required: false
        default: ""

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set image tags (GHCR requires lowercase)
        id: vars
        run: |
          set -euo pipefail
          repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag_input='${{ github.event.inputs.image_tag }}'
            if [ -z "${tag_input}" ]; then
              tag_input="$(git rev-parse --short HEAD)"
            fi
            tag=$(echo "${tag_input}" | tr '[:upper:]' '[:lower:]')
          else
            tag=$(echo '${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]')
          fi
          echo "repo=${repo}" >> $GITHUB_OUTPUT
          echo "tag=${tag}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo }}/frontend:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.repo }}/frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo }}/backend:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.repo }}/backend:latest
