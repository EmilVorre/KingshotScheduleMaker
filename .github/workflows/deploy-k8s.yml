name: Deploy To Kubernetes

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (release tag or latest)"
        required: true
        default: latest
      run_migration_job:
        description: "Apply JSON->Postgres migration Job (true/false)"
        required: true
        default: false
        type: boolean
      migration_dry_run:
        description: "Migration job DRY_RUN value"
        required: true
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  NAMESPACE: kingshot
  # Bump when upgrading cert-manager: https://github.com/cert-manager/cert-manager/releases
  CERT_MANAGER_VERSION: v1.16.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "${KUBE_CONFIG}" ]; then
            echo "KUBE_CONFIG secret is required"
            exit 1
          fi
          mkdir -p "${HOME}/.kube"
          printf '%s\n' "${KUBE_CONFIG}" > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"
          kubectl cluster-info

      - name: Ensure cert-manager
        run: |
          set -euo pipefail
          if ! kubectl get crd certificates.cert-manager.io >/dev/null 2>&1; then
            echo "Installing cert-manager ${CERT_MANAGER_VERSION}..."
            kubectl apply -f "https://github.com/cert-manager/cert-manager/releases/download/${CERT_MANAGER_VERSION}/cert-manager.yaml"
            kubectl wait --for=condition=Established crd/certificates.cert-manager.io --timeout=120s
          else
            echo "cert-manager CRDs already present; skipping install."
          fi
          kubectl wait --namespace cert-manager --for=condition=Available --timeout=300s deployment --all

      - name: Apply Let's Encrypt ClusterIssuer
        env:
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "${ACME_EMAIL}" ]; then
            echo "::warning::Secret ACME_EMAIL is not set; skipping ClusterIssuer. Add it in repo Settings → Secrets to issue TLS certs via Let's Encrypt."
            exit 0
          fi
          sed "s|you@example.com|${ACME_EMAIL}|g" k8s/cert-manager-letsencrypt-clusterissuer.yaml | kubectl apply -f -

      - name: Resolve image names
        id: vars
        run: |
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "tag=$(echo '${{ github.event.inputs.image_tag }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "run_migration=$(echo '${{ github.event.inputs.run_migration_job }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "migration_dry_run=$(echo '${{ github.event.inputs.migration_dry_run }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Apply base manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/backend.yaml
          kubectl apply -f k8s/frontend.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Update deployment images
        run: |
          set -euo pipefail
          kubectl -n "${NAMESPACE}" set image deployment/backend \
            backend="${REGISTRY}/${{ steps.vars.outputs.repo }}/backend:${{ steps.vars.outputs.tag }}"
          kubectl -n "${NAMESPACE}" set image deployment/frontend \
            frontend="${REGISTRY}/${{ steps.vars.outputs.repo }}/frontend:${{ steps.vars.outputs.tag }}"
          kubectl -n "${NAMESPACE}" rollout status deployment/backend --timeout=300s
          kubectl -n "${NAMESPACE}" rollout status deployment/frontend --timeout=300s

      - name: Apply migration job (optional)
        if: ${{ steps.vars.outputs.run_migration == 'true' }}
        run: |
          set -euo pipefail
          BACKEND_IMAGE="${REGISTRY}/${{ steps.vars.outputs.repo }}/backend:${{ steps.vars.outputs.tag }}"
          DRY_RUN_VALUE="${{ steps.vars.outputs.migration_dry_run }}"
          sed -e "s#ghcr.io/emilvorre/kingshotschedulemaker/backend:latest#${BACKEND_IMAGE}#g" \
              -e "s#value: \"false\"#value: \"${DRY_RUN_VALUE}\"#g" \
              k8s/migration-job.yaml > /tmp/migration-job.yaml
          kubectl -n "${NAMESPACE}" delete job json-to-pg-migration --ignore-not-found=true
          kubectl apply -f /tmp/migration-job.yaml
          kubectl -n "${NAMESPACE}" wait --for=condition=complete --timeout=1800s job/json-to-pg-migration
          kubectl -n "${NAMESPACE}" logs job/json-to-pg-migration
